<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Créer un compte - Espace Commerçant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <div class="commercant-auth-card">
            <div class="auth-header">
                <h1>🏪 Créer mon compte</h1>
                <p>Créez un compte pour suivre l'historique de vos paiements fiscaux</p>
            </div>

            <form id="registerForm" class="auth-form">
                <div class="form-group">
                    <label for="code_unique">Code Boutique *</label>
                    <input type="text" id="code_unique" name="code_unique" 
                           value="{{ code_prefill or '' }}"
                           placeholder="Ex: BOUTIQUE-57891" required 
                           style="text-transform: uppercase;">
                    <small>Le code figurant sur votre QR code</small>
                </div>
                <div class="form-group">
                    <label for="telephone">Téléphone *</label>
                    <input type="tel" id="telephone" name="telephone" 
                           value="{{ telephone_prefill or '' }}"
                           placeholder="+237 6XX XXX XXX" required>
                    <small>Le numéro enregistré lors de l'enregistrement du commerce</small>
                </div>
                <div class="form-group">
                    <label for="mot_de_passe">Mot de passe *</label>
                    <input type="password" id="mot_de_passe" name="mot_de_passe" 
                           placeholder="Minimum 6 caractères" required minlength="6">
                </div>
                <div class="form-group">
                    <label for="mot_de_passe_confirm">Confirmer le mot de passe *</label>
                    <input type="password" id="mot_de_passe_confirm" name="mot_de_passe_confirm" 
                           placeholder="Répétez le mot de passe" required>
                </div>
                <div id="registerError" class="auth-error" style="display: none;"></div>
                <button type="submit" class="btn btn-primary btn-block">Créer mon compte</button>
            </form>

            <div class="auth-footer">
                <p>Déjà un compte ? <a href="{{ url_for('commercant_connexion') }}">Se connecter</a></p>
                <p><a href="/">← Retour à l'accueil</a></p>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = document.getElementById('mot_de_passe').value;
            const passwordConfirm = document.getElementById('mot_de_passe_confirm').value;
            const errorDiv = document.getElementById('registerError');
            const submitBtn = e.target.querySelector('button[type="submit"]');

            if (password !== passwordConfirm) {
                errorDiv.textContent = 'Les mots de passe ne correspondent pas';
                errorDiv.style.display = 'block';
                return;
            }

            errorDiv.style.display = 'none';
            submitBtn.disabled = true;
            submitBtn.textContent = 'Création...';

            try {
                const response = await fetch('/api/commercant/inscription', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        code_unique: document.getElementById('code_unique').value.trim().toUpperCase(),
                        telephone: document.getElementById('telephone').value.trim(),
                        mot_de_passe: password
                    })
                });
                const data = await response.json();

                if (response.ok && data.success) {
                    window.location.href = '/commercant/dashboard';
                } else {
                    errorDiv.textContent = data.error || 'Erreur lors de la création';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.textContent = 'Erreur de connexion. Réessayez.';
                errorDiv.style.display = 'block';
            }
            submitBtn.disabled = false;
            submitBtn.textContent = 'Créer mon compte';
        });
    </script>
</body>
</html>
