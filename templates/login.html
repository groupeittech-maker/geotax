<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion — GeoTax</title>
    {% include '_head.html' %}
</head>
<body class="auth-page">
    <div class="container">
        <div class="commercant-auth-card">
            <div class="auth-header">
                <div class="auth-brand">
                    <span class="auth-brand-mark">GT</span>
                </div>
                <h1>GeoTax</h1>
                <p>Connexion équipe — fiscalité &amp; géo-stratégie</p>
            </div>

            <form method="POST" class="auth-form">
                <div class="form-group">
                    <label for="username">Identifiant</label>
                    <input type="text" id="username" name="username" required 
                           placeholder="Nom d'utilisateur" autofocus>
                </div>
                <div class="form-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" id="password" name="password" required 
                           placeholder="Mot de passe">
                </div>
                {% if error %}
                <div class="auth-error">{{ error }}</div>
                {% endif %}
                <button type="submit" class="btn btn-primary btn-block">Se connecter</button>
            </form>

            <div class="auth-footer">
                <p><a href="/">← Retour à l'accueil</a></p>
                <p><a href="/commercant">Espace Contribuable →</a></p>
            </div>
        </div>
    </div>
</body>
</html>
