# Nginx hôte (VPS) — geotax.ittechmed.com → GeoTax Docker (:8080)
# Installer : deploy/hostinger/setup_geotax_ssl.py

include /etc/nginx/snippets/camera-policy.conf;

server {
    listen 80;
    listen [::]:80;
    server_name geotax.ittechmed.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name geotax.ittechmed.com;

    ssl_certificate /etc/letsencrypt/live/geotax.ittechmed.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/geotax.ittechmed.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    include /etc/nginx/snippets/camera-policy.conf;
    add_header Permissions-Policy "camera=(self)" always;
    add_header Feature-Policy "camera 'self'" always;

    client_max_body_size 16M;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 120s;
    }
}
